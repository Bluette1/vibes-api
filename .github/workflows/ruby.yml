name: Ruby

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
env:
  # Use the Supabase expected admin user for the supabase/postgres image
  POSTGRES_USER: supabase_admin
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: postgres

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        # Use Supabase's Postgres image which includes pg_graphql and other extensions.
        image: supabase/postgres:17.6.1.002
        env:
          POSTGRES_USER: supabase_admin
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U ${{ env.POSTGRES_USER }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"

      - name: Install dependencies
        run: bundle install

      - name: Create the database
        run: bin/rails db:create

      - name: Run RuboCop
        run: bundle exec rubocop -d

      - name: Run tests
        run: bundle exec rake test