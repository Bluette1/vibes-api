default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  <<: *default
  database: vibes_api_development
  username: <%= ENV.fetch("POSTGRES_USER") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") %>
  host: <%= ENV.fetch("POSTGRES_HOST") { "localhost" } %>

test:
  <<: *default
  database: vibes_api_test
  username: <%= ENV.fetch("POSTGRES_USER") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD") %>
  host: <%= ENV.fetch("POSTGRES_HOST") { "localhost" } %>

production:
  <<: *default
  url: <%= ENV['DATABASE_URL'] %>
  # Supabase requires SSL. Prefer adding `?sslmode=require` to DATABASE_URL.
  # Alternatively, uncomment the next line and set DB_SSLMODE=require in the environment.
  # sslmode: <%= ENV['DB_SSLMODE'] %>
  # If you use Supabase Pooler (PgBouncer, typically port 6543), it's recommended
  # to disable prepared statements to avoid transaction-pooling issues.
  prepared_statements: <%= ENV.fetch('PG_PREPARED_STATEMENTS', 'true') == 'true' %>
  # database: your_app_name_production
  # username: <%= ENV["POSTGRES_USER"] %>
  # password: <%= ENV["POSTGRES_PASSWORD"] %>